name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
  deploy-preproduction:
    # Ensayo: preproducción corre en el equipo del autor; este paso solo documenta el ambiente.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy to preproduction (staging) environment"

name: deploy
on:
  push:
    branches: [main, 'vigilante/original-*', 'vigilante/hotfix-*']
  repository_dispatch:
    types: [vigilante-restore]

jobs:
  preproduction:
    # main, the verification branches, and the return to main requested by the VPS after each verification.
    # Preproduction restores its test database on every start (railway startCommand).
    runs-on: ubuntu-latest
    concurrency:
      group: preproduction
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.repository.default_branch || github.sha }}
      - run: npm install --global @railway/cli@4.30.3
      - run: bash scripts/deploy.sh preproduction "$(git rev-parse HEAD)"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PREPRODUCTION }}

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: npm ci
      - run: npm test
      - run: npm install --global @railway/cli@4.30.3
      - run: bash scripts/deploy.sh production "$(git rev-parse HEAD)"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
